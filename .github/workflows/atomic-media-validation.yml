name: Atomic media download validation
on:
  push:
    branches:
      - test/atomic-media-e2e-20261111

permissions:
  contents: read

jobs:
  test:
    name: Unit + E2E / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-httpserver feedgen
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "*_test.py"
      - name: Run E2E tests
        run: pytest e2e
