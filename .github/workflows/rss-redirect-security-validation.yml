name: RSS feed redirect security validation
on:
  push:
    branches:
      - test/rss-redirect-security-e2e-20261111

permissions:
  contents: read

jobs:
  tests:
    name: Unit and E2E - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-httpserver feedgen
      - name: Run unit suite
        run: python -m unittest discover -s tests -p "*_test.py"
      - name: Run E2E suite
        run: pytest e2e
